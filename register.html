<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Eventify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand"><span class="logo-text">EVENTIFY</span></a>
      <h2>Create Your Account</h2>
      <p>Join Eventify for instant ticket bookings and updates</p>
    </div>

    <form action="login.html" class="auth-form">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" class="form-control" placeholder="Rahul Sharma" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="auth-options">
        <label class="remember-me">
          <input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary full-width">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="login.html">Sign In</a></p>
      <p class="mt-10"><a href="index.html">← Return to Home</a></p>
    </div>
  </div>

</body>
</html>
