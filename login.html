<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Eventify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand"><span class="logo-text">EVENTIFY</span></a>
      <h2>Welcome Back</h2>
      <p>Sign in to manage your events and tickets</p>
    </div>

    <form action="tickets.html" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="auth-options">
        <label class="remember-me">
          <input type="checkbox"> Remember Me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary full-width">Sign In</button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="register.html">Create Account</a></p>
      <p class="mt-10"><a href="index.html">← Return to Home</a></p>
    </div>
  </div>

</body>
</html>
